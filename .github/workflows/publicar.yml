name: Gerar e publicar PDFs marcados
on:
  push:
    paths: ['.github/workflows/publicar.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyMuPDF==1.26.7' 'requests==2.32.5'
      - run: python publicar_remoto.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
